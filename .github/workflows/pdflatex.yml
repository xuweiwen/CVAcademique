name: LaTeX build

permissions:
  contents: write

on:
  push:
    branches-ignore:
      - 'example-pdf'
    paths:
      - '**/*.tex'
      - '**/*.cls'

jobs:
  build-latex:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install TeX Live packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            latexmk
            # texlive-full # Use this to install full TeX Live distribution
      - name: Build PDF
        run: |
          # 1. Normal version, compile 'example.pdf' in repo root
          latexmk -pdf -interaction=nonstopmode examples/example.tex
          # 2. Build single-column layout version (temporary wrapper), compile 'example-single-column.pdf' in repo root
          cat > examples/_wrapper_single_column.tex <<'EOF'
          \PassOptionsToClass{singlecolumn}{cvacademique}
          \input{examples/example.tex}
          EOF
          latexmk -pdf -interaction=nonstopmode -jobname=example-single-column examples/_wrapper_single_column.tex
      - name: Commit and push to orphan branch
        run: |
          # Switch to orphan branch
          git checkout --orphan example-pdf
          git rm -rf .

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          git add -f example.pdf example-single-column.pdf

          if git diff --cached --quiet; then
            echo "example.pdf has not changed. Skipping commit and push."
          else
            git commit -m "Built PDFs"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push -f origin example-pdf
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}